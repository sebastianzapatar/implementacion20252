name: Trigger auto deployment for implementacion20252

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/implementacion20252-AutoDeployTrigger-8976f103-3fb5-4bde-a7db-361a79d80f06.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.IMPLEMENTACION20252_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.IMPLEMENTACION20252_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.IMPLEMENTACION20252_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.IMPLEMENTACION20252_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.IMPLEMENTACION20252_REGISTRY_PASSWORD }}
          containerAppName: implementacion20252
          resourceGroup: implementacion20252
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


