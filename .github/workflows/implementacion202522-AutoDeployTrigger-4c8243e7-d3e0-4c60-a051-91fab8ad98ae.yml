name: Trigger auto deployment for implementacion202522

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ azurenube ]
    paths:
    - '**'
    - '.github/workflows/implementacion202522-AutoDeployTrigger-4c8243e7-d3e0-4c60-a051-91fab8ad98ae.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.IMPLEMENTACION202522_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.IMPLEMENTACION202522_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.IMPLEMENTACION202522_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.IMPLEMENTACION202522_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.IMPLEMENTACION202522_REGISTRY_PASSWORD }}
          containerAppName: implementacion202522
          resourceGroup: NetworkWatcherRG
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


