name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: implementacion20252.azurecr.io     # <-- tu login server real
  IMAGE_NAME: springboot-app                   # como quieras llamar la imagen
  RESOURCE_GROUP: implementacion20252
  CONTAINERAPP_NAME: implementacion20252       # o el nombre real de tu Container App
  ACR_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # (Opcional) build del JAR si usas Maven
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build jar (Maven)
        run: mvn -B -DskipTests package

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}         # o usa az acr login + docker login con token
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_REPO }}:${{ github.sha }}
            ${{ env.ACR_REPO }}:latest

      - name: Deploy to Azure Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINERAPP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.ACR_REPO }}:${{ github.sha }}
